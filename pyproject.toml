[tool.setuptools]
packages = ["app"]  # only app/ is the package; web/alembic/artifacts are not

[project]
name = "potato"
version = "0.1.0"
description = "Potato Test — agentic E2E test platform: NL test cases executed in a real browser, recorded, judged."
requires-python = ">=3.11"
dependencies = [
    # --- 本地单人使用所需要的一切 ---
    # 这一组就是"一个人在一台机器上跑起来"的完整依赖：SQLite 当数据库、
    # 进程内队列，不需要 Postgres / Redis / Celery。
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # 默认数据库（SQLite）
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sse-starlette>=2.1",       # SSE：助手流式输出 / 运行实时进度
    "openai>=1.30",             # 走 OpenAI 兼容接口调 LLM（裁判 + Agent）
    "cryptography>=42",         # Fernet：加密存储测试凭据
    "openpyxl>=3.1",            # Excel 用例导入导出
    "python-multipart>=0.0.9",  # 表单上传（Excel 导入）
    "bcrypt>=4.1",              # 密码哈希
    "pyjwt>=2.8",               # 会话 JWT（httpOnly cookie）
    # Browser automation. Pinned EXACTLY, and to the combo this code was verified against:
    # browser-use's Agent kwargs (max_actions_per_step / step_timeout / use_vision /
    # register_new_step_callback) and its ChatOpenAI signature change between releases, and
    # browser-use also pins openai<3 (2.26.0 here). Letting pip resolve these freely is how
    # you get an app that imports fine but cannot start a run.
    "browser-use[video]==0.13.10",
    "playwright==1.63.0",
]

# ---------------------------------------------------------------------------
# 可选能力。下面这些默认都是关闭的集成，本地单人使用一个都不需要，
# 所以不再作为必需依赖强塞给每个人。要用哪个就装哪个，例如：
#     pip install -e ".[feishu]"
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# 部署到服务器 / 用 Docker 时装这个（= 上面全部可选能力）
all = [
    "asyncpg>=0.29",            # Postgres 驱动（换掉默认的 SQLite）
    "alembic>=1.13",            # 数据库迁移（容器入口会跑 alembic upgrade head）
    "boto3>=1.34",              # S3 兼容对象存储（不装则产物存本地磁盘）
    "celery>=5.3",              # GitLab 缺陷同步：推送任务 + 定时轮询
    "redis>=5.0",               # Celery 的 broker / result backend
    "lark-oapi>=1.4",           # 飞书机器人（独立进程 app/feishu_ws.py）
]
feishu = ["lark-oapi>=1.4"]
gitlab = ["celery>=5.3", "redis>=5.0"]
s3 = ["boto3>=1.34"]
postgres = ["asyncpg>=0.29"]
migrate = ["alembic>=1.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001: failure isolation is this codebase's core model (engine drain, per-case
#   executor, judge fallback) — blind Exception catches are deliberate there.
# E712: `col == True` is the idiomatic SQLAlchemy filter form used throughout;
#   ruff's "use `if col:`" suggestion is wrong for ORM boolean columns.
ignore = ["BLE001", "E712"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["unit: fast pure-logic tests (no browser/network/db)"]
