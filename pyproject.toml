[tool.setuptools]
packages = ["app"]  # only app/ is the package; web/alembic/artifacts are not

[project]
name = "potato"
version = "0.1.0"
description = "Potato Test — agentic E2E test platform: NL test cases executed in a real browser, recorded, judged."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # dev DB; use asyncpg for Postgres
    "asyncpg>=0.29",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sse-starlette>=2.1",       # server-sent events for the assistant streaming endpoint
    "openai>=1.30",             # judge / LLM over the LLM gateway (OpenAI-compatible)
    "boto3>=1.34",              # RustFS (S3-compatible) artifact storage
    "cryptography>=42",         # Fernet encryption for stored test credentials
    "celery>=5.3",              # GitLab issue sync: push tasks + beat poller
    "redis>=5.0",               # Celery broker/result backend
    "alembic>=1.13",            # migrations — the container entrypoint runs `alembic upgrade head`
    "openpyxl>=3.1",            # Excel (.xlsx) test-case import/export
    "python-multipart>=0.0.9",  # multipart form uploads (Excel import)
    "bcrypt>=4.1",              # password hashing
    "pyjwt>=2.8",               # session JWTs (httpOnly cookie)
    "lark-oapi>=1.4",           # Feishu bot: long-connection (WebSocket) event worker
    # Browser automation. Pinned EXACTLY, and to the combo this code was verified against:
    # browser-use's Agent kwargs (max_actions_per_step / step_timeout / use_vision /
    # register_new_step_callback) and its ChatOpenAI signature change between releases, and
    # browser-use also pins openai<3 (2.26.0 here). Letting pip resolve these freely is how
    # you get an app that imports fine but cannot start a run.
    "browser-use[video]==0.13.10",
    "playwright==1.63.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001: failure isolation is this codebase's core model (engine drain, per-case
#   executor, judge fallback) — blind Exception catches are deliberate there.
# E712: `col == True` is the idiomatic SQLAlchemy filter form used throughout;
#   ruff's "use `if col:`" suggestion is wrong for ORM boolean columns.
ignore = ["BLE001", "E712"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["unit: fast pure-logic tests (no browser/network/db)"]
