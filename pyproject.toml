[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]  # only app/ is the package; web/alembic/artifacts are not

[project]
name = "potato"
version = "1.0.7"
description = "Potato Test — agentic E2E test platform: NL test cases executed in a real browser, recorded, judged."
# ★ 只认 3.13（2026-10-20）：打包产物里是 python313.dll，而这里以前写 >=3.11、
#   CI 也跑 3.11 —— 于是"CI 绿"和"装出来的东西能用"之间没有关系。
#   现在声明、CI、ruff、mypy 四处统一到 3.13；升级解释器时一起改。
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- 本地单人使用所需要的一切 ---
    # 这一组就是"一个人在一台机器上跑起来"的完整依赖：SQLite 当数据库、
    # 进程内队列，不需要 Postgres / Redis / Celery。
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # 默认数据库（SQLite）
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sse-starlette>=2.1",       # SSE：助手流式输出 / 运行实时进度
    "openai>=1.30",             # 走 OpenAI 兼容接口调 LLM（裁判 + Agent）
    "cryptography>=42",         # Fernet：加密存储测试凭据
    "openpyxl>=3.1",            # Excel 用例导入导出
    "python-multipart>=0.0.9",  # 表单上传（Excel 导入）
    "bcrypt>=4.1",              # 密码哈希
    "pyjwt>=2.8",               # 会话 JWT（httpOnly cookie）
    # Browser automation. Pinned EXACTLY, and to the combo this code was verified against:
    # browser-use's Agent kwargs (max_actions_per_step / step_timeout / use_vision /
    # register_new_step_callback) and its ChatOpenAI signature change between releases, and
    # browser-use also pins openai<3 (2.26.0 here). Letting pip resolve these freely is how
    # you get an app that imports fine but cannot start a run.
    "browser-use[video]==0.13.10",
    "playwright==1.63.0",
    # --- 文档解析（上传需规 / 资料）---
    # ★ 2026-10-17 补：这些是 app/docparse.py **直接 import** 的，之前一个都没声明 ——
    #   本机能跑只是因为开发时零散装过；**全新 clone 装完，上传 docx/pdf 会直接 ImportError**。
    "python-docx>=1.1",         # docx（段落 + 表格）
    "pypdf>=4.0",               # PDF 文字层
    "beautifulsoup4>=4.12",     # html
    "lxml>=5.0",                # BeautifulSoup 的解析器
    "markdownify>=0.11",        # html → markdown
    # --- OCR：扫描件 / 截图（2026-10-17 用户要求「上 OCR」）---
    # ★ 必须是 `rapidocr`（3.x）而不是老包名 `rapidocr-onnxruntime` ——
    #   后者 `requires_python = <3.13`，而本项目跑在 3.13 上，pip 会疯狂回溯旧版本后失败。
    # 纯 pip 包、自带中英文模型、不需要用户另装 Tesseract，也能直接打进桌面版安装包。
    # PyMuPDF 只负责把"没有文字层的 PDF 页"渲染成图。
    # 没装这两样也能跑 —— 扫描件会退回"建议转成 md"的提示，不会让上传失败。
    # 向量检索（2026-10-19）：bge-small-zh-v1.5 的 tokenizer 走这个库，
    # 不用 transformers（那会把 torch 拖进来，200MB+）。
    "tokenizers>=0.20",
    # OCR 用的 opencv：**承认 5.x**（2026-10-20）。旧注释写"锁在 4.x"，但 venv 与
    # 打包产物实际一直是 5.0（5.0.0.93）—— 声明和事实相反，比版本本身更危险。
    # 本项目只用 cv2 做图片解码/缩放，5.0 上已通过现有 OCR 路径；若将来出现回归，
    # 再显式降到 4.x 并重新验证扫描件，而不是留一条与安装结果矛盾的注释。
    "opencv-python-headless>=5.0,<6",
    "pymupdf>=1.24",
    "rapidocr>=3.0",
    # ★ rapidocr 把 onnxruntime 当成**可选**依赖；不显式装，RapidOCR 能构造成功，
    #   但一调用就 ImportError 并被降级成"没识别出文字"（CI 就是这样红的）。
    "onnxruntime>=1.17",
    "pillow>=10.0",
    "numpy>=1.26",
]

# ---------------------------------------------------------------------------
# 可选能力。下面这些默认都是关闭的集成，本地单人使用一个都不需要，
# 所以不再作为必需依赖强塞给每个人。要用哪个就装哪个，例如：
#     pip install -e ".[feishu]"
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# 部署到服务器 / 用 Docker 时装这个（= 上面全部可选能力）
all = [
    "asyncpg>=0.29",            # Postgres 驱动（换掉默认的 SQLite）
    "alembic>=1.13",            # 数据库迁移（容器入口会跑 alembic upgrade head）
    "boto3>=1.34",              # S3 兼容对象存储（不装则产物存本地磁盘）
    "celery>=5.3",              # GitLab 缺陷同步：推送任务 + 定时轮询
    "redis>=5.0",               # Celery 的 broker / result backend
    "lark-oapi>=1.4",           # 飞书机器人（独立进程 app/feishu_ws.py）
]
feishu = ["lark-oapi>=1.4"]
gitlab = ["celery>=5.3", "redis>=5.0"]
s3 = ["boto3>=1.34"]
postgres = ["asyncpg>=0.29"]
migrate = ["alembic>=1.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "mypy>=1.11,<2", "ruff==0.9.0"]
# 打包桌面版需要的工具链（只有 Windows 用得上）。以前它们只装在开发者本机，
# `scripts/build_desktop.py` 没有声明 —— 新机器 clone 后按 README 装完仍然打不了包。
desktop = [
    "pywebview>=4.4; sys_platform == 'win32'",
    "pyinstaller>=6.11; sys_platform == 'win32'",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# BLE001: failure isolation is this codebase's core model (engine drain, per-case
#   executor, judge fallback) — blind Exception catches are deliberate there.
# E712: `col == True` is the idiomatic SQLAlchemy filter form used throughout;
#   ruff's "use `if col:`" suggestion is wrong for ORM boolean columns.
ignore = ["BLE001", "E712"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["unit: fast pure-logic tests (no browser/network/db)"]

# ---------------------------------------------------------------------------
# 覆盖率（2026-10-08 加）
# 862 个测试听起来很足，但没人知道它们**盖住了哪**。首次实测：app/ 共 9044 条语句，
# 覆盖 53%。最大的两个文件恰恰是最低的 —— api.py 28%（1514 条语句）、
# executor.py 45%（1258 条）—— 也就是说风险最高的地方恰好是测试最少的地方。
# 这个配置的作用是让这个数字可见，并且**只能往上不能往下**。
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = [
    # 本地一次性诊断/基准脚本（bench_browsers / check_* / dump_struct /
    # make_desktop_shortcut）。它们是操作者手动跑的工具，不是产品代码；
    # 算进覆盖率只会把分母撑大、把数字压低，掩盖真正该关注的文件。
    "app/_*.py",
    # 只在配了 Redis 的部署里运行（本机 CI 不装 celery/redis，import 都会失败）。
    "app/celery_app.py",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
# 门槛定在略低于实测值。它要拦的是"覆盖率往下掉"，不是逼着一次补齐 45% ——
# 那种目标只会催生凑数测试。补完一块就往上抬一点，别一次抬到位。
#
# 2026-10-09 从 52 抬到 54：新增 tests/test_api_crud.py（31 条，走真实
# FastAPI 栈）把 api.py 从 25.8% 抬到 28.7%，全量实测 55.4%（938 passed）。
# 留 1.4 个点的余量而不是贴着 55.4 设：干净 CI 上 test_judge_gate 那几条
# 会因为没有 potato.db 而整体 skip，覆盖率天然比本机低一点。
fail_under = 54

# ---------------------------------------------------------------------------
# 类型检查（2026-10-08 加）
# 刻意从**宽松**开始，理由：这个代码库大量使用 duck-typing 的替身（测试里的
# _Run/_Settings 一类）和 SQLAlchemy 的动态列访问，上来就 strict 会产出几百条
# 与真实缺陷无关的告警，然后所有人学会忽略 mypy —— 那比没有更糟。
# 现在的目标只有一个：**新代码不再引入明显类型错误**，存量逐步收。
#
# ★ 依赖里把 mypy 锁在 <2（见 dev extra），这条不是随手加的：
#   1) mypy 2.4 的 native parser 在本机 Python 3.13 上会内部 panic
#      （pyo3_runtime.PanicException: entered unreachable code），装了就完全用不了；
#   2) 2.x 的默认检查强度与 1.x 不同，会导致"本地绿、CI 红"这种最难查的偏差 ——
#      门禁必须两边跑同一套工具链才有意义。
#   什么时候能解掉：mypy 2.x 修掉 3.13 的 panic，且本地按 2.x 重新过一遍严格子集。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
# 不因为存量问题阻塞：先把 mypy 跑起来看清单，再决定哪些开成 error。
warn_unused_ignores = false
warn_redundant_casts = false
no_implicit_optional = true
# 这几个文件是纯函数 + 类型标注已经写得比较满的，单独开更严的检查收益最高。
# 之所以不全局开：SQLAlchemy 的 Mapped[]/relationship 在这个版本下仍会误报。
[[tool.mypy.overrides]]
module = ["app.page_gate", "app.spec_drift", "app.failure_attrib", "app.suite_schedule", "app.cdp_endpoint"]
disallow_untyped_defs = true
